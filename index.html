<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>folio.sma</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="navbar">
    <div class="container navbar-inner">
      <a href="index.html" class="navbar-brand">
        <span class="brand-badge">f</span>
        <span><span style="color: #1E1E24;">folio</span><span style="color: #92140C;">.sma</span></span>
      </a>
      <button type="button" class="nav-toggle" id="navToggle" aria-label="Menu Navigasi">
        <i data-lucide="menu" width="20" height="20"></i>
      </button>
      <ul class="navbar-menu" id="navbarMenu">
        <li><a href="index.html" class="nav-link active">Beranda</a></li>
        <li><a href="arsip.html" class="nav-link">Dokumen</a></li>
        <li><a href="portofolio.html" class="nav-link">Portofolio</a></li>
      </ul>
    </div>
  </header>

  <main class="main-content">
    <div class="container upload-center-section">
      <div class="upload-box-wrapper">
        <div class="page-header-center">
          <h1 class="page-title">Unggah Dokumen Portofolio</h1>
          <p class="page-subtitle">Unggah sertifikat lomba, kepanitiaan, dan organisasi dalam tiga klik secara rapi.</p>
        </div>

        <div class="drop-zone" id="dropZone" role="button" tabindex="0" aria-label="Area Unggah Dokumen">
          <div class="drop-zone-icon">
            <i data-lucide="upload-cloud" width="28" height="28"></i>
          </div>
          <div>
            <h2 class="drop-zone-title">Tarik dan lepas berkas ke sini</h2>
            <p class="drop-zone-meta">Mendukung format PDF, JPG, atau PNG</p>
          </div>
          <button type="button" class="btn btn-primary" id="selectFileBtn">
            <i data-lucide="folder-plus" width="18" height="18"></i>
            <span>Pilih Berkas</span>
          </button>
          <input type="file" id="fileInput" class="file-input-hidden" accept=".jpg,.jpeg,.png,.pdf,image/jpeg,image/png,application/pdf">
        </div>
      </div>
    </div>
  </main>

  <div class="modal-backdrop" id="uploadModal" aria-hidden="true">
    <div class="modal-window" role="dialog" aria-modal="true" aria-labelledby="uploadModalTitle">
      <div class="modal-header">
        <h2 class="modal-title" id="uploadModalTitle">Kategori Dokumen</h2>
        <button type="button" class="modal-close" id="closeModalBtn" aria-label="Tutup">
          <i data-lucide="x" width="18" height="18"></i>
        </button>
      </div>

      <div class="modal-body">
        <div class="file-summary-box">
          <span class="file-summary-name" id="detectedFileName">-</span>
          <span class="badge badge-apricot" id="detectedFileExt">PDF</span>
        </div>

        <div class="form-group">
          <span class="form-label">Jenis Dokumen</span>
          <div class="pill-group" data-pill-group="jenis">
            <button type="button" class="pill-btn active" data-value="Sertifikat Lomba">Sertifikat Lomba</button>
            <button type="button" class="pill-btn" data-value="Kepanitiaan">Kepanitiaan</button>
            <button type="button" class="pill-btn" data-value="Organisasi">Organisasi</button>
          </div>
        </div>

        <div class="form-group">
          <span class="form-label">Bidang</span>
          <div class="pill-group" data-pill-group="bidang">
            <button type="button" class="pill-btn active" data-value="Akademik">Akademik</button>
            <button type="button" class="pill-btn" data-value="Non-Akademik">Non-Akademik</button>
            <button type="button" class="pill-btn" data-value="Kepemimpinan">Kepemimpinan</button>
          </div>
        </div>

        <div class="form-group">
          <span class="form-label">Tahun</span>
          <div class="pill-group" data-pill-group="tahun">
            <button type="button" class="pill-btn active" data-value="2026">2026</button>
            <button type="button" class="pill-btn" data-value="2025">2025</button>
            <button type="button" class="pill-btn" data-value="2024">2024</button>
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" id="cancelModalBtn">Batal</button>
        <button type="button" class="btn btn-primary" id="saveArchiveBtn">Simpan Dokumen</button>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="container footer-inner">
      <span><strong style="color: #1E1E24;">folio</strong><strong style="color: #92140C;">.sma</strong> — 2026</span>
    </div>
  </footer>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="js/app.js"></script>
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
